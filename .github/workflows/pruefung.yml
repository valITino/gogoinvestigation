# Prüft bei jeder Änderung, dass sich der Arbeitsplatz auf Linux, macOS und Windows einrichten lässt
# und dass die Schutzmechanismen dort greifen. Braucht weder Schlüssel noch ein Claude-Konto.
name: Prüfung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  einrichtung:
    name: Einrichtung (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux", os: ubuntu-latest, shell: bash }
          - { name: "macOS", os: macos-latest, shell: bash }
          - { name: "Windows, PowerShell 5.1", os: windows-latest, shell: powershell }
          - { name: "Windows, PowerShell 7", os: windows-latest, shell: pwsh }
    defaults:
      run:
        shell: ${{ matrix.shell }}     # unter Windows läuft die Einrichtung einmal je PowerShell-Version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skripte statisch prüfen (Linux)
        if: runner.os == 'Linux'
        run: shellcheck --severity=warning setup.sh .claude/hooks/start.sh

      - name: Skript statisch prüfen (Windows)
        if: runner.os == 'Windows'
        run: |
          $fehler = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\setup.ps1), [ref]$null, [ref]$fehler)
          if ($fehler) { $fehler | ForEach-Object { Write-Host $_ }; exit 1 }
          if (Get-Module -ListAvailable -Name PSScriptAnalyzer) {
            $funde = @(Invoke-ScriptAnalyzer -Path .\setup.ps1 -Severity Error)
            $funde | Format-Table -AutoSize | Out-String | Write-Host
            if ($funde.Count -gt 0) { exit 1 }
          }

      # Docker bleibt aussen vor: Die Abbilder von Web-Check und Robin sind gross und für die Prüfung unnötig.
      - name: Einrichtung (Linux, macOS)
        if: runner.os != 'Windows'
        run: ./setup.sh --ohne-docker

      - name: Einrichtung (Windows)
        if: runner.os == 'Windows'
        run: |
          & .\setup.ps1 --ohne-docker
          exit $LASTEXITCODE

      - name: Mythos freischalten und zurücknehmen (Linux, macOS)
        if: runner.os != 'Windows'
        run: ./setup.sh --ohne-docker --mythos && ./setup.sh --ohne-docker --ohne-mythos

      - name: Mythos freischalten und zurücknehmen über setup.cmd (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call setup.cmd --ohne-docker --mythos || exit /b 1
          call setup.cmd --ohne-docker --ohne-mythos || exit /b 1

      - name: Meldungen der Installationsprogramme (nur bei Fehlern)
        if: failure()
        shell: bash
        run: |
          for ordner in "${TMPDIR:-/tmp}/osint-setup" "${RUNNER_TEMP}/osint-setup" "${TEMP:-/tmp}/osint-setup" "${LOCALAPPDATA:-/nonexistent}/Temp/osint-setup"; do
            [ -d "$ordner" ] || continue
            for datei in "$ordner"/*.log; do
              echo "::group::$datei"; tail -n 60 "$datei"; echo "::endgroup::"
            done
          done

      - name: Musterfall fällt auf diesem System byte-gleich aus
        shell: bash
        run: |
          git status --porcelain --untracked-files=no
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Claude Code nimmt die Einstellungen an
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          claude --version
          ausgabe="$(timeout 180 claude doctor 2>&1 || true)"
          if printf '%s\n' "$ausgabe" | grep -i -A6 "invalid settings"; then exit 1; fi
          echo "Keine ungültigen Einstellungen gemeldet."
