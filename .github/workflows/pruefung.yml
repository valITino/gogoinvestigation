# Prüft bei jeder Änderung, dass sich der Arbeitsplatz auf Linux, macOS und Windows einrichten lässt
# und dass die Schutzmechanismen dort greifen. Braucht weder Schlüssel noch ein Claude-Konto.
name: Prüfung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Das README nennt Python 3.10 als Minimum, die Einrichtung läuft unten mit 3.12. Schreibweisen, die erst ab 3.12
  # gelten (etwa Anführungszeichen derselben Art in einer f-Zeichenkette), fielen sonst erst beim Nutzer auf.
  syntax:
    name: Syntax unter Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
      - name: Jede Python-Datei übersetzen
        run: python -m compileall -q gateway tools .claude/hooks

  # Die Tabellen zur lokalen Pseudonymisierung im README schreibt tools/pseudo_messen.py. Hier wird gemessen und
  # verglichen: Ändert jemand die Erkennung, die Feldmarken oder den Prüfsatz, ohne neu zu messen, fällt es auf.
  # Braucht nur die Standardbibliothek. Unter Python 3.10 und unter der neuesten Version, damit dieselben Zahlen
  # nicht an einer Version hängen.
  messung:
    name: Messwerte der Pseudonymisierung (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Messen und mit dem README vergleichen
        run: python tools/pseudo_messen.py --pruefen

  einrichtung:
    name: Einrichtung (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux", os: ubuntu-latest, shell: bash }
          - { name: "macOS", os: macos-latest, shell: bash }
          - { name: "Windows, PowerShell 5.1", os: windows-latest, shell: powershell }
          - { name: "Windows, PowerShell 7", os: windows-latest, shell: pwsh }
    defaults:
      run:
        shell: ${{ matrix.shell }}     # unter Windows läuft die Einrichtung einmal je PowerShell-Version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Skripte statisch prüfen (Linux)
        if: runner.os == 'Linux'
        run: shellcheck --severity=warning setup.sh .claude/hooks/start.sh

      - name: Skript statisch prüfen (Windows)
        if: runner.os == 'Windows'
        run: |
          $fehler = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\setup.ps1), [ref]$null, [ref]$fehler)
          if ($fehler) { $fehler | ForEach-Object { Write-Host $_ }; exit 1 }
          if (Get-Module -ListAvailable -Name PSScriptAnalyzer) {
            $funde = @(Invoke-ScriptAnalyzer -Path .\setup.ps1 -Severity Error)
            $funde | Format-Table -AutoSize | Out-String | Write-Host
            if ($funde.Count -gt 0) { exit 1 }
          }

      # Docker bleibt aussen vor: Die Abbilder von Web-Check und Robin sind gross und für die Prüfung unnötig.
      # Hier gibt es kein Terminal, die Einrichtung fragt also nichts. Den Assistenten selbst prüfen die
      # Selbsttests, unter Linux und macOS in einem Pseudo-Terminal.
      - name: Einrichtung (Linux, macOS)
        if: runner.os != 'Windows'
        run: ./setup.sh --ohne-rueckfragen --ohne-docker

      - name: Einrichtung (Windows)
        if: runner.os == 'Windows'
        run: |
          & .\setup.ps1 --ohne-rueckfragen --ohne-docker
          exit $LASTEXITCODE

      - name: Mythos freischalten und zurücknehmen (Linux, macOS)
        if: runner.os != 'Windows'
        run: ./setup.sh --ohne-docker --mythos && ./setup.sh --ohne-docker --ohne-mythos

      - name: Mythos freischalten und zurücknehmen über setup.cmd (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call setup.cmd --ohne-docker --mythos || exit /b 1
          call setup.cmd --ohne-docker --ohne-mythos || exit /b 1

      - name: Ausführliche Prüfung mit allen Selbsttests (Linux, macOS)
        if: runner.os != 'Windows'
        run: python3 tools/pruefen.py

      - name: Ausführliche Prüfung mit allen Selbsttests (Windows)
        if: runner.os == 'Windows'
        run: |
          python tools\pruefen.py
          exit $LASTEXITCODE

      # Unter WSL nennt die Oberfläche ihre Adresse mit localhost, und die Einrichtung führt eigene Schritte auf. Ein echtes WSL
      # gibt es hier nicht: Die Selbsttests laufen deshalb ein zweites Mal so, als wäre es eines. Ein Test, der nur unter WSL
      # scheitert, fiel am 18.11.2026 erst auf dem Rechner eines Nutzers auf.
      - name: Selbsttests wie unter WSL (Linux)
        if: runner.os == 'Linux'
        env:
          WSL_DISTRO_NAME: Ubuntu
        run: python3 tools/selbsttest.py

      # Die Oberfläche startet mit einem Befehl, auf jedem System: Server hoch, Hauptseiten abrufen, fremden Host-Kopf abweisen, beenden.
      - name: Oberfläche starten (Linux, macOS)
        if: runner.os != 'Windows'
        run: python3 tools/oberflaeche.py --selbstpruefung

      - name: Oberfläche starten (Windows)
        if: runner.os == 'Windows'
        run: |
          python tools\oberflaeche.py --selbstpruefung
          exit $LASTEXITCODE

      - name: Meldungen der Installationsprogramme (nur bei Fehlern)
        if: failure()
        shell: bash
        run: |
          for ordner in "${TMPDIR:-/tmp}/osint-setup" "${RUNNER_TEMP}/osint-setup" "${TEMP:-/tmp}/osint-setup" "${LOCALAPPDATA:-/nonexistent}/Temp/osint-setup"; do
            [ -d "$ordner" ] || continue
            for datei in "$ordner"/*.log; do
              echo "::group::$datei"; tail -n 60 "$datei"; echo "::endgroup::"
            done
          done

      - name: Musterfall fällt auf diesem System byte-gleich aus
        shell: bash
        run: |
          git status --porcelain --untracked-files=no
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Claude Code nimmt die Einstellungen an
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          claude --version
          ausgabe="$(timeout 180 claude doctor 2>&1 || true)"
          if printf '%s\n' "$ausgabe" | grep -i -A6 "invalid settings"; then exit 1; fi
          echo "Keine ungültigen Einstellungen gemeldet."
